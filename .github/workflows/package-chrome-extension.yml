name: Package Chrome Extension

on:
  push:
    tags:
      - "chrome-v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChromeExtension
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read version from manifest
        id: manifest
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#chrome-v}"
          manifest_version="${{ steps.manifest.outputs.version }}"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Build package
        run: |
          zip -r "../geniuslink-chrome-extension-v${{ steps.manifest.outputs.version }}.zip" . \
            -x ".vscode/*" \
            -x "tests/*" \
            -x "bower_components/*" \
            -x "README.md" \
            -x "package.json" \
            -x "package-lock.json" \
            -x ".DS_Store" \
            -x "**/.DS_Store"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geniuslink-chrome-extension-v${{ steps.manifest.outputs.version }}
          path: geniuslink-chrome-extension-v${{ steps.manifest.outputs.version }}.zip
          if-no-files-found: error
