name: Package Chrome Extension

on:
  push:
    branches:
      - master
    paths:
      - "ChromeExtension/manifest.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ChromeExtension
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # manifest.json is the source of truth. On master, a push that changes
      # `version` is a release. The new version must be newer than the previous
      # commit's, so versions only increase along master and runs that finish in
      # any order still tag consistently; it must also be newer than every
      # chrome-v* tag, which catches hand-made tags. Other manifest edits never
      # release, and a missing tag for an older version is never created here.
      # Manual runs are test builds and never tag.
      - name: Resolve version
        id: manifest
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # True if version $1 is strictly newer than version $2.
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }

          version=$(node -p "require('./manifest.json').version")
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::manifest.json version $version is not a valid Chrome extension version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          release=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if ! git fetch --quiet --depth=1 origin "$BEFORE"; then
              echo "::error::Could not fetch the previous master commit $BEFORE to compare manifest versions"
              exit 1
            fi
            previous=$(git show "$BEFORE:ChromeExtension/manifest.json" \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")

            if [ "$previous" = "$version" ]; then
              echo "Version unchanged ($version); nothing to release."
            elif [ "$(git ls-remote origin "refs/tags/chrome-v$version" | cut -f1)" = "$GITHUB_SHA" ]; then
              # A re-run after this commit was already tagged.
              echo "chrome-v$version already points at this commit; nothing to release."
            elif ! newer "$version" "$previous"; then
              echo "::error::Version $version must be greater than the previous master version $previous"
              exit 1
            else
              latest=$(git ls-remote --tags --refs origin 'chrome-v*' \
                | sed 's#.*refs/tags/chrome-v##' \
                | sort -V | tail -n1 || true)
              if [ -n "$latest" ] && ! newer "$version" "$latest"; then
                echo "::error::Version $version must be greater than the latest released version $latest"
                exit 1
              fi
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Build package
        if: steps.manifest.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          zip -r "../geniuslink-chrome-extension-v${{ steps.manifest.outputs.version }}.zip" . \
            -x ".vscode/*" \
            -x "tests/*" \
            -x "bower_components/*" \
            -x "README.md" \
            -x "package.json" \
            -x "package-lock.json" \
            -x ".DS_Store" \
            -x "**/.DS_Store"

      - name: Upload artifact
        if: steps.manifest.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geniuslink-chrome-extension-v${{ steps.manifest.outputs.version }}
          path: geniuslink-chrome-extension-v${{ steps.manifest.outputs.version }}.zip
          if-no-files-found: error

      # Tagged here rather than in a separate workflow: tags pushed with
      # GITHUB_TOKEN do not trigger other workflows. No concurrency group: it would
      # cancel pending releases. Versions only increase along master (see Resolve
      # version), so concurrent runs tag consistently, and the non-forced push
      # fails if the tag already exists.
      - name: Tag release
        if: steps.manifest.outputs.release == 'true'
        run: |
          git tag "chrome-v${{ steps.manifest.outputs.version }}" "$GITHUB_SHA"
          git push origin "chrome-v${{ steps.manifest.outputs.version }}"
