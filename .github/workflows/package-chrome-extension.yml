name: Package Chrome Extension

on:
  push:
    tags:
      - "chrome-v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChromeExtension
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On a chrome-v* tag, the tag is the source of truth: it must be newer than
      # every previous chrome-v* tag and is written into manifest.json. Manual
      # runs package the manifest version as-is.
      - name: Resolve version
        id: manifest
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#chrome-v}"
            if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not a valid Chrome extension version"
              exit 1
            fi

            latest=$(git ls-remote --tags --refs origin 'chrome-v*' \
              | sed 's#.*refs/tags/chrome-v##' \
              | grep -vxF "$version" \
              | sort -V | tail -n1 || true)
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)" != "$version" ]; then
              echo "::error::Version $version must be greater than the latest released version $latest"
              exit 1
            fi

            node -e '
              const fs = require("fs");
              const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
              manifest.version = process.argv[1];
              fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 4) + "\n");
            ' "$version"
          else
            version=$(node -p "require('./manifest.json').version")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          zip -r "../geniuslink-chrome-extension-v${{ steps.manifest.outputs.version }}.zip" . \
            -x ".vscode/*" \
            -x "tests/*" \
            -x "bower_components/*" \
            -x "README.md" \
            -x "package.json" \
            -x "package-lock.json" \
            -x ".DS_Store" \
            -x "**/.DS_Store"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geniuslink-chrome-extension-v${{ steps.manifest.outputs.version }}
          path: geniuslink-chrome-extension-v${{ steps.manifest.outputs.version }}.zip
          if-no-files-found: error
